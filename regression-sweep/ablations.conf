# Ablation matrix for the cluster-support-feature-branch perf regression.
#
# Format (whitespace-separated, '#' = comment):
#   <label>  <side>  <branch>                                <perf_dump>
#
# - <label>     short ID, used in result filenames (no spaces).
# - <side>      "server" → patch lives in typedb; rebuild server_b binary.
#               "driver" → patch lives in typedb-driver; rebuild new_b wheel.
# - <branch>    branch name on the relevant repo's fork (FORK_REMOTE, default
#               "farost"). The script fetches and checks it out — pass the
#               bare branch name, no remote prefix.
# - <perf_dump> 1 = enable TYPEDB_*_PERF_DUMP for this run, 0 = silent.
#
# Branch convention used here: same branch name exists on both typedb and
# typedb-driver forks. Each row picks the appropriate repo via <side>.
#
#   cluster-support-feature-branch              — base cluster tip, no perf
#   cluster-support-feature-branch-perf         — perf counters only
#   cluster-support-feature-branch-perf-ablation-1  — perf + S1 (typedb) / D1 (typedb-driver)
#   cluster-support-feature-branch-perf-ablation-2  — perf + S2 / D2
#   cluster-support-feature-branch-perf-ablation-3  — perf + S3 / D3
#
# The script always runs against the local mode3 harness:
#   - server side: server_b + driver_a (DRIVER_VARIANT=a, ./benchmark.sh mode3 b)
#   - driver side: server_a + driver_b (DRIVER_VARIANT=b, ./benchmark.sh mode3 a)

# Baseline: instrumented but no ablation. Confirms the perf-counter overhead
# is negligible relative to the regression.
S0   server   cluster-support-feature-branch-perf              1
D0   driver   cluster-support-feature-branch-perf              1

# Server-side ablations (S1 = skip txn record, S2 = stub WAL dir-fsync,
# S3 = drop outer commit spawn).
S1   server   cluster-support-feature-branch-perf-ablation-1   1
S2   server   cluster-support-feature-branch-perf-ablation-2   1
S3   server   cluster-support-feature-branch-perf-ablation-3   1

# Driver-side ablations (D1 = short-circuit single-server replica seek,
# D2 = drop RPC timeout wrap, D3 = no-op LatencyTracker).
D1   driver   cluster-support-feature-branch-perf-ablation-1   1
D2   driver   cluster-support-feature-branch-perf-ablation-2   1
D3   driver   cluster-support-feature-branch-perf-ablation-3   1
